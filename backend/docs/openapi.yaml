openapi: 3.1.0

info:
  title: Workspace SaaS API
  version: "1.0.0"
  description: |
    REST API for a multi-tenant team workspace.

    ## Authentication

    Sanctum SPA authentication over an HTTP-only session cookie. There are no
    bearer tokens and no JWT.

    A browser client must:

    1. `GET /sanctum/csrf-cookie` once, to receive the `XSRF-TOKEN` cookie.
    2. Send every mutating request with that cookie's value in the
       `X-XSRF-TOKEN` header, and with credentials included.
    3. Originate from a host listed in `SANCTUM_STATEFUL_DOMAINS`. Sanctum only
       starts a session for requests whose `Origin`/`Referer` matches, so a
       non-browser client must set `Origin` explicitly.

    ## Tenancy

    Every workspace-scoped route resolves the tenant from the `{workspace}`
    path segment and verifies an **active membership** before anything else
    runs. A workspace id in a request body is never trusted and never used.

    A workspace, or a record inside one, that the caller is not a member of
    answers `404` with the same body as a record that does not exist, so the
    API cannot be used to discover which ids are real.

    ## Conventions

    - A single resource is wrapped in `data`; a collection is a `data` array.
    - Paginated collections add Laravel's standard `links` and `meta`, default
      20 per page, capped at 100 via `per_page`.
    - All ids are UUID v4.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Authentication
  - name: Workspaces
  - name: Projects
  - name: Tasks
  - name: Members
  - name: Invitations
  - name: Activities
  - name: Dashboard

security:
  - sessionCookie: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Create an account
      description: |
        Creates the account only. No session is established and no workspace is
        created — the client signs in as a separate step.

        Rate limited to 5 requests per minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8, format: password }
                password_confirmation: { type: string, format: password }
            example:
              name: Priya Nair
              email: priya@example.com
              password: correct-horse-battery
              password_confirmation: correct-horse-battery
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
              example:
                data:
                  id: 9f8d2c14-6b3a-4a51-9f1e-2c7d5b8e4a10
                  name: Priya Nair
                  email: priya@example.com
                  created_at: "2026-09-13T10:00:00+00:00"
                  updated_at: "2026-09-13T10:00:00+00:00"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Start a session
      description: |
        Sets the session cookie and rotates the session id.

        Rate limited to 5 attempts per minute per email+IP, and 20 per minute
        per IP. Wrong credentials answer `422` with an identical message
        whether or not the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example: { email: priya@example.com, password: correct-horse-battery }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "422":
          description: Credentials rejected, or the payload is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
              example:
                message: These credentials do not match our records.
                errors:
                  email: ["These credentials do not match our records."]
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: End the session
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/me:
    get:
      tags: [Authentication]
      summary: The signed-in user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /workspaces:
    get:
      tags: [Workspaces]
      summary: Workspaces you belong to
      description: |
        Only workspaces where the caller has an active membership. Not
        paginated: a user belongs to a handful and the switcher needs them all.
      responses:
        "200":
          description: Your workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
              example:
                data:
                  - id: 3f1b9c22-8d4e-4c1a-b6f7-1e2a3b4c5d6e
                    name: Northwind
                    role: admin
                    created_at: "2026-09-13T10:00:00+00:00"
                    updated_at: "2026-09-13T10:00:00+00:00"
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      description: "The creator becomes its first admin, in the same transaction."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
            example: { name: Northwind }
      responses:
        "201":
          description: Created, with the caller's role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /workspaces/{workspace}:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Workspaces]
      summary: Read a workspace
      description: "Any active member."
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Workspaces]
      summary: Rename a workspace
      description: "Admins only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      description: |
        Admins only. A soft delete: the workspace disappears from every listing
        and becomes unreachable, and nothing it owns is cascaded or erased.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace}/projects:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Projects]
      summary: List projects
      description: "Any active member. Archived projects are included; they stay readable."
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Project" }
                  - $ref: "#/components/schemas/Pagination"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Projects]
      summary: Create a project
      description: |
        Admins only. Projects are always created active; `status` is not
        accepted here, so archiving always goes through the transition that
        records it. Names are unique within a workspace, including against
        archived projects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 5000 }
            example: { name: "Billing rewrite", description: "Move invoicing off the legacy service" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
              example:
                message: A project with this name already exists in this workspace.
                errors:
                  name: ["A project with this name already exists in this workspace."]

  /workspaces/{workspace}/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/workspace"
      - $ref: "#/components/parameters/project"
    get:
      tags: [Projects]
      summary: Read a project
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: Update or archive a project
      description: |
        Admins only. Every field is optional. Setting `status` to `archived`
        runs the same transition as `DELETE` and records one
        `project.archived` activity; setting it back to `active` restores it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 5000 }
                status: { $ref: "#/components/schemas/ProjectStatus" }
            example: { name: Billing rewrite, status: archived }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Projects]
      summary: Archive a project
      description: |
        Admins only. **Archives rather than deletes** — projects have no soft
        delete, they use `active`/`archived`. The row is retained, stays
        readable and keeps its tasks and history; it simply stops accepting new
        tasks. Idempotent.
      responses:
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace}/tasks:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        Any active member. Soft-deleted tasks are excluded. Only the filters
        and sorts below are accepted; anything else is a `422`.
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid }, description: "Must be a project in this workspace." }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/TaskPriority" } }
        - { name: assignee_id, in: query, schema: { type: string, format: uuid }, description: "Not required to still be a member." }
        - { name: search, in: query, schema: { type: string, maxLength: 255 }, description: "Case-insensitive match on title and description. Wildcards are treated literally." }
        - name: sort
          in: query
          description: "Prefix with `-` for descending. Defaults to `-created_at`."
          schema:
            type: string
            enum: [title, -title, due_date, -due_date, created_at, -created_at, updated_at, -updated_at]
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: A page of tasks
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }
                  - $ref: "#/components/schemas/Pagination"
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        Any active member. The project must belong to this workspace and must
        not be archived; the assignee must be an active member of this
        workspace. `workspace_id` is taken from the route and ignored if sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, project_id]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 5000 }
                project_id: { type: string, format: uuid }
                assignee_id: { type: [string, "null"], format: uuid }
                status: { $ref: "#/components/schemas/TaskStatus" }
                priority: { $ref: "#/components/schemas/TaskPriority" }
                due_date: { type: [string, "null"], format: date, description: "`Y-m-d`." }
            example:
              title: Reconcile invoice totals
              project_id: 7c2f5a90-1d3e-4b8c-9a6f-0e1d2c3b4a59
              priority: high
              due_date: "2026-09-15"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
              examples:
                archivedProject:
                  summary: The project is archived
                  value:
                    message: An archived project cannot receive new tasks.
                    errors:
                      project_id: ["An archived project cannot receive new tasks."]
                foreignAssignee:
                  summary: The assignee is not a member here
                  value:
                    message: The assignee must be an active member of this workspace.
                    errors:
                      assignee_id: ["The assignee must be an active member of this workspace."]

  /workspaces/{workspace}/tasks/{task}:
    parameters:
      - $ref: "#/components/parameters/workspace"
      - $ref: "#/components/parameters/task"
    get:
      tags: [Tasks]
      summary: Read a task
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      summary: Update a task
      description: |
        Any active member. Every field is optional. Moving a task into an
        archived project is refused; a task already in one stays editable.

        Each kind of change records its own activity: `task.status_changed`,
        `task.priority_changed`, `task.assigned`, and one `task.updated` for
        the remaining fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 5000 }
                project_id: { type: string, format: uuid }
                assignee_id: { type: [string, "null"], format: uuid }
                status: { $ref: "#/components/schemas/TaskStatus" }
                priority: { $ref: "#/components/schemas/TaskPriority" }
                due_date: { type: [string, "null"], format: date }
            example: { status: done }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Tasks]
      summary: Delete a task
      description: |
        Any active member. A soft delete: the row is retained and drops out of
        every listing, and the task's activity history is preserved.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace}/members:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Members]
      summary: List members
      description: "Any active member. Removed memberships are excluded."
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: A page of members
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Member" }
                  - $ref: "#/components/schemas/Pagination"
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{workspace}/members/{member}:
    parameters:
      - $ref: "#/components/parameters/workspace"
      - $ref: "#/components/parameters/member"
    patch:
      tags: [Members]
      summary: Change a member's role
      description: |
        Admins only. A workspace must always keep at least one admin, so
        demoting the last one is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/WorkspaceRole" }
            example: { role: admin }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validation or business-rule failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
              example:
                message: A workspace must always have at least one admin.
                errors:
                  role: ["A workspace must always have at least one admin."]
    delete:
      tags: [Members]
      summary: Remove a member
      description: |
        Admins only. A soft delete, so the person can be invited back and their
        history is kept. Removing the last admin is refused.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Would leave the workspace without an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
              example:
                message: A workspace must always have at least one admin.
                errors:
                  member: ["A workspace must always have at least one admin."]

  /workspaces/{workspace}/invitations:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Invitations]
      summary: List invitations
      description: |
        Admins only. Accepted and expired invitations stay listed as history;
        withdrawn ones are soft-deleted and drop out. The token is never
        returned, in any form.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: A page of invitations
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invitation" }
                  - $ref: "#/components/schemas/Pagination"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Invitations]
      summary: Invite someone
      description: |
        Admins only. Generates a 256-bit token, stores only its SHA-256 digest,
        and emails the raw token as a link valid for 7 days. The token appears
        in the email and nowhere else — not in this response, not in the
        database.

        An expired invitation for the same address is superseded automatically;
        a pending one is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                role: { $ref: "#/components/schemas/WorkspaceRole" }
            example: { email: sam@example.com, role: user }
      responses:
        "201":
          description: Invitation created and emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Conflicts with the current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              examples:
                alreadyMember:
                  value: { message: That person is already a member of this workspace. }
                alreadyInvited:
                  value: { message: There is already a pending invitation for this email address. }
        "422": { $ref: "#/components/responses/ValidationError" }

  /workspaces/{workspace}/invitations/{invitation}:
    parameters:
      - $ref: "#/components/parameters/workspace"
      - $ref: "#/components/parameters/invitation"
    delete:
      tags: [Invitations]
      summary: Withdraw an invitation
      description: |
        Admins only. The link stops working and the address becomes free to
        invite again. An invitation that has already been accepted cannot be
        withdrawn — the membership it produced is real, and removing the record
        would lose history.
      responses:
        "204": { description: Withdrawn }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example: { message: This invitation has already been accepted. }

  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: "The raw token from the invitation email."
        schema: { type: string, minLength: 64, maxLength: 64 }
    post:
      tags: [Invitations]
      summary: Accept an invitation
      description: |
        Requires authentication, and the signed-in account's email must match
        the invited address. Not workspace-scoped: the caller is not a member
        yet.

        The membership and the acceptance are one transaction, and the role
        applied is the one the admin issued.
      responses:
        "201":
          description: Joined. Returns the workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Signed in as someone other than the invited address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example: { message: This action is unauthorized. }
        "404":
          description: No such invitation, or it was withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example: { message: Resource not found. }
        "409":
          description: Cannot be accepted in its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              examples:
                expired:
                  value: { message: This invitation has expired. }
                used:
                  value: { message: This invitation has already been accepted. }
                member:
                  value: { message: That person is already a member of this workspace. }

  /workspaces/{workspace}/activities:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Activities]
      summary: The activity feed
      description: |
        Any active member. **Read-only** — activities are written by the
        business operations that cause them, and no endpoint creates, edits or
        deletes one. Newest first.
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ActivityType" } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
      responses:
        "200":
          description: A page of activities
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Activity" }
                  - $ref: "#/components/schemas/Pagination"
              example:
                data:
                  - id: 5a1c8e33-7f2b-4d6a-8c9e-0b1a2d3e4f56
                    type: task.status_changed
                    subject_type: task
                    subject_id: 2b3c4d5e-6f70-4812-9a3b-4c5d6e7f8091
                    metadata: { old_status: todo, new_status: done }
                    user_id: 9f8d2c14-6b3a-4a51-9f1e-2c7d5b8e4a10
                    user:
                      id: 9f8d2c14-6b3a-4a51-9f1e-2c7d5b8e4a10
                      name: Priya Nair
                      email: priya@example.com
                      created_at: "2026-09-13T10:00:00+00:00"
                      updated_at: "2026-09-13T10:00:00+00:00"
                    created_at: "2026-09-13T12:00:00+00:00"
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /workspaces/{workspace}/dashboard:
    parameters:
      - $ref: "#/components/parameters/workspace"
    get:
      tags: [Dashboard]
      summary: Workspace summary
      description: |
        Any active member. Counts come from aggregate queries; the two lists
        are capped at 10 items each and have their own paginated endpoints.
      responses:
        "200":
          description: Stats, your tasks, and recent activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [stats, my_tasks, recent_activity]
                    properties:
                      stats:
                        type: object
                        required: [projects, todo, in_progress, completed]
                        properties:
                          projects: { type: integer, description: "Every project, archived included." }
                          todo: { type: integer }
                          in_progress: { type: integer }
                          completed: { type: integer, description: "Tasks with status `done`." }
                      my_tasks:
                        type: array
                        maxItems: 10
                        items: { $ref: "#/components/schemas/Task" }
                      recent_activity:
                        type: array
                        maxItems: 10
                        items: { $ref: "#/components/schemas/Activity" }
              example:
                data:
                  stats: { projects: 3, todo: 2, in_progress: 1, completed: 2 }
                  my_tasks: []
                  recent_activity: []
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: workspace-saas-session
      description: |
        HTTP-only session cookie set by `POST /auth/login`. Mutating requests
        must also carry the `XSRF-TOKEN` cookie value in an `X-XSRF-TOKEN`
        header, or the request is rejected with `419`.

  parameters:
    workspace:
      name: workspace
      in: path
      required: true
      schema: { type: string, format: uuid }
    project:
      name: project
      in: path
      required: true
      schema: { type: string, format: uuid }
    task:
      name: task
      in: path
      required: true
      schema: { type: string, format: uuid }
    member:
      name: member
      in: path
      required: true
      description: "The membership id, not the user id."
      schema: { type: string, format: uuid }
    invitation:
      name: invitation
      in: path
      required: true
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    perPage:
      name: per_page
      in: query
      description: "Values above 100 are capped at 100."
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    WorkspaceRole:
      type: string
      enum: [admin, user]
    ProjectStatus:
      type: string
      enum: [active, archived]
    TaskStatus:
      type: string
      enum: [todo, in_progress, blocked, done]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    InvitationStatus:
      type: string
      description: "Derived from `accepted_at` and `expires_at`; not a column."
      enum: [pending, accepted, expired]
    ActivityType:
      type: string
      enum:
        - task.created
        - task.status_changed
        - task.assigned
        - task.priority_changed
        - task.updated
        - task.deleted
        - project.created
        - project.archived
        - member.invited
        - invitation.accepted
        - member.removed
        - member.role_changed

    User:
      type: object
      description: "Never includes the password hash or any credential field."
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Workspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role:
          allOf: [{ $ref: "#/components/schemas/WorkspaceRole" }]
          description: "The caller's own role here. Present so a client can hide controls it may not use; the server still decides."
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Project:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Task:
      type: object
      required: [id, title, status, priority, project_id]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        due_date: { type: [string, "null"], format: date }
        project_id: { type: string, format: uuid }
        assignee_id: { type: [string, "null"], format: uuid }
        project:
          allOf: [{ $ref: "#/components/schemas/Project" }]
          description: "Present when the endpoint eager loads it."
        assignee:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Member:
      type: object
      description: "A membership. `workspace_id` is omitted; it is in the route."
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        user: { $ref: "#/components/schemas/User" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Invitation:
      type: object
      required: [id, email, role, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        invited_by: { $ref: "#/components/schemas/User" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Activity:
      type: object
      description: "Append-only. Retained even when its subject is soft-deleted."
      required: [id, type, subject_type, subject_id, metadata]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ActivityType" }
        subject_type:
          type: string
          description: "A stable morph alias, not a class name."
          enum: [user, workspace, workspace_member, workspace_invitation, project, task]
        subject_id: { type: string, format: uuid }
        metadata:
          type: object
          description: "Event-specific detail, such as `old_status`/`new_status`."
          additionalProperties: true
        user_id:
          type: [string, "null"]
          format: uuid
          description: "Null for system-generated events."
        user:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        created_at: { type: [string, "null"], format: date-time }

    Pagination:
      type: object
      required: [links, meta]
      properties:
        links:
          type: object
          properties:
            first: { type: [string, "null"] }
            last: { type: [string, "null"] }
            prev: { type: [string, "null"] }
            next: { type: [string, "null"] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: [integer, "null"] }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: [integer, "null"] }
            total: { type: integer }

    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    Unauthenticated:
      description: No valid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: Unauthenticated. }
    Forbidden:
      description: Signed in and a member, but not allowed to do this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: This action is unauthorized. }
    NotFound:
      description: |
        No such record, **or** one the caller may not reach. Both answer
        identically so the API cannot be used to discover which ids exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: Resource not found. }
    ValidationError:
      description: Validation or business-rule failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    TooManyRequests:
      description: Rate limit exceeded. Retry after the `Retry-After` header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
          example: { message: Too Many Attempts. }
